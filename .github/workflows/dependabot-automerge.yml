name: Dependabot Auto-Merge & Smoke Test
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  # Step 1: Smoke test build based on .github/workflows/docker.yml
  smoke-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get latest OpenTTD and OpenGFX versions
        id: get_versions
        run: |
          LATEST=$(curl -s -H 'Accept: application/vnd.github.v3+json' https://api.github.com/repos/JGRennison/OpenTTD-patches/releases | jq -cMr '([.[]|select(all(.tag_name; contains("beta")|not))])|.[:1]|.[].tag_name')
          LATEST_GFX=$(curl -s -H 'Accept: application/vnd.github.v3+json' https://api.github.com/repos/OpenTTD/OpenGFX/releases | jq -cMr '([.[]|select(all(.tag_name; contains("beta")|not))])|.[:1]|.[].tag_name')
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          echo "latest_gfx=${LATEST_GFX}" >> $GITHUB_OUTPUT

      - name: Checkout OpenTTD-patches
        uses: actions/checkout@v6
        with:
          repository: 'JGRennison/OpenTTD-patches'
          ref: ${{ steps.get_versions.outputs.latest }}
          path: OpenTTD-patches

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke test image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          platforms: linux/amd64
          build-args: OPENGFX_VERSION=${{ steps.get_versions.outputs.latest_gfx }}
          load: true
          tags: openttd-smoke-test:latest
          cache-from: type=gha

      - name: Run container smoke test
        run: |
          echo "Testing OpenTTD binary help flag..."
          docker run --rm openttd-smoke-test:latest -h
          echo "Testing container healthcheck probe exists and runs..."
          docker run --rm --entrypoint /openttd/healthcheck openttd-smoke-test:latest || true

  # Step 2: Automatically approve and merge safe Dependabot PRs once the smoke test passes
  dependabot-merge:
    name: Dependabot Approve & Merge
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve Dependabot PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Automatically merges minor and patch updates once the smoke test passes.
      # Major updates (breaking changes) are approved but left for manual review.
      - name: Enable auto-merge for safe updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
